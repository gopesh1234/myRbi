@{
    Layout = null;
}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <title>SSC Mock Tracker</title>

    <style>

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Segoe UI',sans-serif;
            }

            body {
                background: linear-gradient(135deg,#667eea,#764ba2);
                min-height: 100vh;
                padding: 15px;
            }

            .tabs {
                display: flex;
                gap: 8px;
                position: sticky;
                top: 10px;
                z-index: 100;
                margin-bottom: 15px;
            }

            .tab-btn {
                flex: 1;
                border: none;
                padding: 12px;
                border-radius: 15px;
                font-weight: 700;
                color: white;
                background: rgba(255,255,255,.15);
                backdrop-filter: blur(10px);
                cursor: pointer;
            }

                .tab-btn.active {
                    background: white;
                    color: #5a4fd6;
                }

            .section {
                display: none;
            }

                .section.active {
                    display: block;
                }

            .dashboard {
                background: white;
                border-radius: 20px;
                padding: 18px;
                margin-bottom: 15px;
                box-shadow: 0 10px 30px rgba(0,0,0,.15);
            }

                .dashboard h2 {
                    color: #5a4fd6;
                    margin-bottom: 15px;
                }

            .dashboard-grid {
                display: grid;
                grid-template-columns: repeat(2,1fr);
                gap: 10px;
            }

            .dashboard-box {
                background: #f4f4ff;
                padding: 12px;
                border-radius: 12px;
                text-align: center;
            }

                .dashboard-box span {
                    display: block;
                    font-size: 12px;
                    color: #666;
                }

                .dashboard-box strong {
                    font-size: 18px;
                    color: #5a4fd6;
                }

            .summary-card {
                background: white;
                border-radius: 20px;
                padding: 15px;
                margin-bottom: 15px;
            }

                .summary-card h3 {
                    color: #5a4fd6;
                    margin-bottom: 10px;
                }

            .add-btn {
                width: 100%;
                border: none;
                padding: 14px;
                border-radius: 15px;
                background: #00c853;
                color: white;
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 15px;
                cursor: pointer;
            }

            .card {
                background: rgba(255,255,255,.15);
                backdrop-filter: blur(15px);
                border-radius: 20px;
                padding: 18px;
                margin-bottom: 15px;
                border: 1px solid rgba(255,255,255,.2);
                color: white;
            }

            .mock-title {
                font-size: 18px;
                font-weight: 700;
                margin-bottom: 15px;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-size: 13px;
            }

            input {
                width: 100%;
                padding: 10px;
                border: none;
                border-radius: 10px;
            }

            .stats {
                margin-top: 15px;
                display: grid;
                grid-template-columns: repeat(4,1fr);
                gap: 8px;
            }

            .stat {
                background: rgba(255,255,255,.15);
                padding: 10px;
                border-radius: 10px;
                text-align: center;
            }

                .stat span {
                    display: block;
                    font-size: 12px;
                }

                .stat strong {
                    font-size: 16px;
                }

            .btn-row {
                display: flex;
                gap: 10px;
                margin-top: 15px;
            }

            .lock-btn {
                flex: 1;
                border: none;
                padding: 10px;
                border-radius: 10px;
                background: #ff9800;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }

            .delete-btn {
                flex: 1;
                border: none;
                padding: 10px;
                border-radius: 10px;
                background: #e53935;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }

            .reset-btn {
                width: 100%;
                margin-top: 10px;
                border: none;
                padding: 12px;
                border-radius: 12px;
                background: #e53935;
                color: white;
                font-weight: bold;
                cursor: pointer;
            }

    </style>
</head>

<body>

    <div class="dashboard">

        <select id="mockSelector"
                onchange="updateMockComparison()"
                style="
            width:100%;
            padding:12px;
            border-radius:12px;
            margin-bottom:15px;
            border:1px solid #ddd;">
        </select>

        <div class="dashboard-grid">

            <div class="dashboard-box">
                <span>Maths</span>
                <strong id="cmpMaths">0</strong>
            </div>

            <div class="dashboard-box">
                <span>Reasoning</span>
                <strong id="cmpReasoning">0</strong>
            </div>

            <div class="dashboard-box">
                <span>English</span>
                <strong id="cmpEnglish">0</strong>
            </div>

            <div class="dashboard-box">
                <span>GS</span>
                <strong id="cmpGS">0</strong>
            </div>

            <div class="dashboard-box">
                <span>Total / 200</span>
                <strong id="cmpTotal">0</strong>
            </div>

            <div class="dashboard-box">
                <span>Accuracy</span>
                <strong id="cmpAccuracy">0%</strong>
            </div>

        </div>

    </div>
    <div class="tabs">
        <button class="reset-btn" onclick="resetData()">
            Reset All Data
        </button>
        <button class="add-btn"
                style="margin-top:10px;"
                onclick="downloadPDF()">
            📄 Download PDF Report
        </button>

    </div>

    <div class="tabs">

        <button class="tab-btn active" onclick="showSection('maths',this)">
            Maths
        </button>

        <button class="tab-btn" onclick="showSection('reasoning',this)">
            Reasoning
        </button>

        <button class="tab-btn" onclick="showSection('english',this)">
            English
        </button>

        <button class="tab-btn" onclick="showSection('gs',this)">
            GS
        </button>

    </div>

    <div id="maths" class="section active"></div>
    <div id="reasoning" class="section"></div>
    <div id="english" class="section"></div>
    <div id="gs" class="section"></div>

    <script>

            const sections = ["maths","reasoning","english","gs"];

            sections.forEach(sec=>{

            document.getElementById(sec).innerHTML=`

            <div class="summary-card">

            <h3>${sec.toUpperCase()} Average</h3>

            <div>
            Mocks :
            <span class="avgMocks">0</span>
            </div>

            <div>
            Avg Score :
            <span class="avgScore">0</span>
            </div>

            <div>
            Accuracy :
            <span class="avgAccuracy">0%</span>
            </div>

            </div>

            <button class="add-btn"
            onclick="addMock('${sec}')">

            + Add Mock

            </button>

            <div id="${sec}Container"></div>

            `;

            });

            function showSection(id,btn){

            document.querySelectorAll('.section')
            .forEach(x=>x.classList.remove('active'));

            document.querySelectorAll('.tab-btn')
            .forEach(x=>x.classList.remove('active'));

            document.getElementById(id)
            .classList.add('active');

            btn.classList.add('active');

            }

            function addMock(section,data=null){

            const container=
            document.getElementById(section+'Container');

            const card=
            document.createElement('div');

            card.className='card';

            card.innerHTML=`

            <div class="mock-title">
            Mock
            </div>

            <div class="grid">

            <div>
            <label>Total Questions</label>
            <input class="total"
            type="number"
            value="${data?.total || ''}">
            </div>

            <div>
            <label>Attempted</label>
            <input class="attempted"
            type="number"
            value="${data?.attempted || ''}">
            </div>

            <div>
            <label>Correct</label>
            <input class="correct"
            type="number"
            value="${data?.correct || ''}">
            </div>

            </div>

            <div class="stats">

            <div class="stat">
            <span>Wrong</span>
            <strong class="wrong">0</strong>
            </div>

            <div class="stat">
            <span>Unattempted</span>
            <strong class="unattempted">0</strong>
            </div>

            <div class="stat">
            <span>Score</span>
            <strong class="score">0</strong>
            </div>

            <div class="stat">
            <span>Accuracy</span>
            <strong class="accuracy">0%</strong>
            </div>

            </div>

            <div class="btn-row">

            </div>

            `;

            container.prepend(card);

            card.querySelectorAll("input")
            .forEach(i=>{

            i.addEventListener("input",()=>{

            calculate(card);
            saveData();
            refreshAll();

            });

            });

            calculate(card);

            renumber(container);

            saveData();

            refreshAll();

            }

            function calculate(card){

            let total=
            parseInt(card.querySelector(".total").value)||0;

            let attempted=
            parseInt(card.querySelector(".attempted").value)||0;

            let correct=
            parseInt(card.querySelector(".correct").value)||0;

            let wrong=
            attempted-correct;

            if(wrong<0)
            wrong=0;

            let unattempted=
            total-attempted;

            let score=
            (correct*2) - (wrong*0.5);

            let accuracy=
            attempted>0
            ?((correct/attempted)*100).toFixed(2)
            :0;

            card.querySelector(".wrong").innerText=wrong;
            card.querySelector(".unattempted").innerText=unattempted;
            card.querySelector(".score").innerText=score.toFixed(2);
            card.querySelector(".accuracy").innerText=accuracy+"%";

            }

            function toggleLock(btn){

            let card=
            btn.closest(".card");

            let inputs=
            card.querySelectorAll("input");

            let locked=
            btn.dataset.locked==="true";

            inputs.forEach(i=>{

            i.disabled=!locked;

            });

            btn.dataset.locked=!locked;

            btn.innerText=
            locked
            ?"🔒 Lock"
            :"🔓 Unlock";

            saveData();

            }

            function deleteMock(btn){

            let container=
            btn.closest('[id$="Container"]');

            btn.closest(".card").remove();

            renumber(container);

            saveData();

            refreshAll();

            }

            function renumber(container){

            let cards=
            container.querySelectorAll(".card");

            cards.forEach((card,index)=>{

            card.querySelector(".mock-title")
            .innerText=
            "Mock " +
            (cards.length-index);

            });

            }

            function refreshAll(){

            let totalMocks=0;
            let totalScore=0;
            let bestScore=0;

            let totalCorrect=0;
            let totalAttempted=0;

            sections.forEach(sec=>{

            let container=
            document.getElementById(sec+'Container');

            let cards=
            container.querySelectorAll('.card');

            let sectionScore=0;

            cards.forEach(card=>{

            totalMocks++;

            let score=
            parseFloat(
            card.querySelector('.score').innerText
            )||0;

            sectionScore+=score;

            totalScore+=score;

            if(score>bestScore)
            bestScore=score;

            totalCorrect+=
            parseInt(
            card.querySelector('.correct').value
            )||0;

            totalAttempted+=
            parseInt(
            card.querySelector('.attempted').value
            )||0;

            });

            let avgScore=
            cards.length
            ?(sectionScore/cards.length).toFixed(2)
            :0;

            let acc=
            0;

            cards.forEach(card=>{

            acc+=parseFloat(
            card.querySelector('.accuracy')
            .innerText
            )||0;

            });

            acc=
            cards.length
            ?(acc/cards.length).toFixed(2)
            :0;

            let summary=
            document
            .getElementById(sec)
            .querySelector('.summary-card');

            summary.querySelector('.avgMocks')
            .innerText=cards.length;

            summary.querySelector('.avgScore')
            .innerText=avgScore;

            summary.querySelector('.avgAccuracy')
            .innerText=acc+'%';

            });

            let overallAccuracy=
            totalAttempted
            ?((totalCorrect/totalAttempted)*100).toFixed(2)
            :0;

                        const totalMocksEl =
            document.getElementById("totalMocks");

            const totalScoreEl =
            document.getElementById("totalScore");

            const bestScoreEl =
            document.getElementById("bestScore");

            const overallAccuracyEl =
            document.getElementById("overallAccuracy");

            if(totalMocksEl)
            totalMocksEl.innerText=totalMocks;

            if(totalScoreEl)
            totalScoreEl.innerText=
            totalScore.toFixed(2);

            if(bestScoreEl)
            bestScoreEl.innerText=
            bestScore.toFixed(2);

            if(overallAccuracyEl)
            overallAccuracyEl.innerText=
            overallAccuracy+"%";

                        fillMockDropdown();
            updateMockComparison();

            }

            function saveData(){

            let data={};

            sections.forEach(sec=>{

            data[sec]=[];

            document
            .querySelectorAll('#'+sec+'Container .card')
            .forEach(card=>{

            data[sec].push({

            total:
            card.querySelector('.total').value,

            attempted:
            card.querySelector('.attempted').value,

            correct:
            card.querySelector('.correct').value

            });

            });

            });

            localStorage.setItem(
            "sscMockTracker",
            JSON.stringify(data)
            );

            }

                                    function fillMockDropdown(){

                const ddl =
                document.getElementById('mockSelector');

                if(!ddl) return;

                let maxMocks = 0;

                sections.forEach(sec=>{

                    const count =
                    document.querySelectorAll(
                    '#' + sec + 'Container .card'
                    ).length;

                    maxMocks = Math.max(maxMocks,count);

                });

                const currentValue = ddl.value;

                ddl.innerHTML = '';

                for(let i=maxMocks;i>=1;i--){

                    ddl.innerHTML += `
                        <option value="${i}">
                            Mock ${i}
                        </option>
                    `;
                }

                if(currentValue &&
                   ddl.querySelector(`option[value="${currentValue}"]`)){

                    ddl.value = currentValue;
                }

                else if(maxMocks>0){

                    ddl.value=maxMocks;
                }
            }

                        function updateMockComparison(){

                const ddl =
                document.getElementById('mockSelector');

                if(!ddl || !ddl.value) return;

                const mockNo =
                parseInt(ddl.value);

                let maths=0;
                let reasoning=0;
                let english=0;
                let gs=0;

                let totalCorrect=0;
                let totalAttempted=0;

                sections.forEach(sec=>{

                    const cards =
                    [...document.querySelectorAll(
                    '#' + sec + 'Container .card'
                    )];

                    const card =
                    cards.find(c=>
                        c.querySelector('.mock-title')
                        .innerText.trim() === `Mock ${mockNo}`
                    );

                    if(!card) return;

                    const score =
                    parseFloat(
                    card.querySelector('.score').innerText
                    ) || 0;

                    const correct =
                    parseInt(
                    card.querySelector('.correct').value
                    ) || 0;

                    const attempted =
                    parseInt(
                    card.querySelector('.attempted').value
                    ) || 0;

                    totalCorrect += correct;
                    totalAttempted += attempted;

                    if(sec==="maths") maths=score;
                    if(sec==="reasoning") reasoning=score;
                    if(sec==="english") english=score;
                    if(sec==="gs") gs=score;

                });

                document.getElementById("cmpMaths").innerText =
                maths.toFixed(2);

                document.getElementById("cmpReasoning").innerText =
                reasoning.toFixed(2);

                document.getElementById("cmpEnglish").innerText =
                english.toFixed(2);

                document.getElementById("cmpGS").innerText =
                gs.toFixed(2);

                const total =
                maths + reasoning + english + gs;

                document.getElementById("cmpTotal").innerText =
                total.toFixed(2) + " / 200";

                const accuracy =
                totalAttempted
                ? ((totalCorrect/totalAttempted)*100).toFixed(2)
                : 0;

                document.getElementById("cmpAccuracy").innerText =
                accuracy + "%";
            }

        async function downloadPDF(){

        const { jsPDF } = window.jspdf;

        const doc = new jsPDF();

        drawHeader(
        doc,
        "SSC MOCK TRACKER REPORT"
        );

        let y = 25;

        sections.forEach(sec=>{

        const cards =
        document.querySelectorAll(
        '#' + sec + 'Container .card'
        );

        if(cards.length===0)
        return;

        if(y>220){

        doc.addPage();

        drawHeader(
        doc,
        "SSC MOCK TRACKER REPORT"
        );

        y=25;
        }

        doc.setFontSize(14);

        doc.text(
        sec.toUpperCase(),
        14,
        y
        );

        y += 8;

        const rows = [];

        cards.forEach(card=>{

        rows.push([

        card.querySelector('.mock-title')
        .innerText,

        card.querySelector('.total')
        .value || 0,

        card.querySelector('.attempted')
        .value || 0,

        card.querySelector('.correct')
        .value || 0,

        card.querySelector('.wrong')
        .innerText || 0,

        card.querySelector('.score')
        .innerText || 0,

        card.querySelector('.accuracy')
        .innerText || 0

        ]);

        });

        y = drawTable(
        doc,
        14,
        y,
        [
        "Mock",
        "Total",
        "Att",
        "Correct",
        "Wrong",
        "Score",
        "Accuracy"
        ],
        rows
        );

        y += 10;

        });

        // OVERALL SUMMARY

        doc.addPage();

        drawHeader(
        doc,
        "OVERALL SUMMARY"
        );

        y = 30;

        const summaryRows = [];

        sections.forEach(sec=>{

        const cards =
        document.querySelectorAll(
        '#' + sec + 'Container .card'
        );

        let totalScore=0;
        let totalCorrect=0;
        let totalAttempted=0;

        cards.forEach(card=>{

        totalScore +=
        parseFloat(
        card.querySelector('.score')
        .innerText
        ) || 0;

        totalCorrect +=
        parseInt(
        card.querySelector('.correct')
        .value
        ) || 0;

        totalAttempted +=
        parseInt(
        card.querySelector('.attempted')
        .value
        ) || 0;
        });

        const avgScore =
        cards.length
        ? (totalScore/cards.length)
        .toFixed(2)
        : 0;

        const accuracy =
        totalAttempted
        ? (
        (totalCorrect/totalAttempted)
        *100
        ).toFixed(2)
        : 0;

        summaryRows.push([
        sec.toUpperCase(),
        cards.length,
        avgScore,
        accuracy + "%"
        ]);
        });

        drawTable(
        doc,
        14,
        y,
        [
        "Section",
        "Mocks",
        "Avg Score",
        "Accuracy"
        ],
        summaryRows
        );

        // MOCK COMPARISON

        doc.addPage();

        drawHeader(
        doc,
        "MOCK WISE COMPARISON"
        );

        y = 30;

        let rows = [];

        let maxMocks = 0;

        sections.forEach(sec=>{

        maxMocks = Math.max(
        maxMocks,
        document.querySelectorAll(
        '#' + sec + 'Container .card'
        ).length
        );

        });

        for(let mock=maxMocks;mock>=1;mock--){

        let maths=0;
        let reasoning=0;
        let english=0;
        let gs=0;

        let totalCorrect=0;
        let totalAttempted=0;

        sections.forEach(sec=>{

        const cards =
        [...document.querySelectorAll(
        '#' + sec + 'Container .card'
        )];

        const card =
        cards.find(c=>

        c.querySelector('.mock-title')
        .innerText.trim()
        ===
        `Mock ${mock}`
        );

        if(!card)
        return;

        const score =
        parseFloat(
        card.querySelector('.score')
        .innerText
        ) || 0;

        totalCorrect +=
        parseInt(
        card.querySelector('.correct')
        .value
        ) || 0;

        totalAttempted +=
        parseInt(
        card.querySelector('.attempted')
        .value
        ) || 0;

        if(sec==="maths")
        maths=score;

        if(sec==="reasoning")
        reasoning=score;

        if(sec==="english")
        english=score;

        if(sec==="gs")
        gs=score;
        });

        const total =
        maths +
        reasoning +
        english +
        gs;

        const accuracy =
        totalAttempted
        ? (
        (totalCorrect/totalAttempted)
        *100
        ).toFixed(2)
        : 0;

        rows.push([

        mock,

        maths.toFixed(2),

        reasoning.toFixed(2),

        english.toFixed(2),

        gs.toFixed(2),

        total.toFixed(2),

        accuracy + "%"

        ]);
        }

        drawTable(
        doc,
        14,
        y,
        [
        "Mock",
        "Maths",
        "Reasoning",
        "English",
        "GS",
        "Total",
        "Accuracy"
        ],
        rows
        );

        drawFooter(doc);

        doc.save(
        "SSC_Mock_Tracker_Report.pdf"
        );
        }
        function drawHeader(doc, title){

        doc.setFillColor(90,79,214);

        doc.rect(0,0,210,15,'F');

        doc.setTextColor(255,255,255);

        doc.setFontSize(18);

        doc.text(title,14,10);

        doc.setTextColor(0,0,0);
        }

        function drawFooter(doc){

        const pageCount =
        doc.internal.getNumberOfPages();

        for(let i=1;i<=pageCount;i++){

        doc.setPage(i);

        doc.setFontSize(9);

        doc.text(
        `Page ${i} of ${pageCount}`,
        170,
        290
        );

        doc.text(
        new Date().toLocaleString(),
        14,
        290
        );
        }
        }

        function drawTable(doc,x,y,headers,rows){

        const colWidth =
        180 / headers.length;

        doc.setFontSize(10);

        doc.setFillColor(240,240,255);

        doc.rect(
        x,
        y,
        180,
        8,
        'F'
        );

        doc.setLineDashPattern([1,1],0);

        doc.rect(
        x,
        y,
        180,
        8
        );

        headers.forEach((h,index)=>{

        doc.text(
        String(h),
        x + (index*colWidth) + 2,
        y + 5
        );

        if(index>0){

        doc.line(
        x + (index*colWidth),
        y,
        x + (index*colWidth),
        y+8
        );
        }
        });

        let currentY = y + 8;

        rows.forEach(row=>{

        doc.rect(
        x,
        currentY,
        180,
        8
        );

        row.forEach((cell,index)=>{

        doc.text(
        String(cell),
        x + (index*colWidth) + 2,
        currentY + 5
        );

        if(index>0){

        doc.line(
        x + (index*colWidth),
        currentY,
        x + (index*colWidth),
        currentY+8
        );
        }
        });

        currentY += 8;
        });

        doc.setLineDashPattern([],0);

        return currentY;
        }

            function loadData(){

            let data=
            JSON.parse(
            localStorage.getItem(
            "sscMockTracker"
            )||"{}");

            sections.forEach(sec=>{

            (data[sec]||[])
            .reverse()
            .forEach(mock=>{

            addMock(sec,mock);

            });

            });

            fillMockDropdown();

            }

            function resetData(){

            if(confirm("Delete all data?")){

            localStorage.removeItem(
            "sscMockTracker"
            );

            location.reload();

            }

            }

            loadData();

    </script>

</body>
</html>
